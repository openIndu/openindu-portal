# The prerendered 404 page for a URL that is not found: /en/... gets the English one.
map $uri $not_found_page {
    default     /404.html;
    ~^/en(/|$)  /404.en.html;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 50m;

    # Emit relative Location headers (no scheme/host/port) on redirects below,
    # so the TLS-terminating K8s Ingress in front of this container (which
    # itself listens on plain :80) doesn't get its https:// downgraded to
    # http:// in the rebuilt absolute URL, forcing an extra plaintext hop.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static assets. Vite names its build output <name>-<8-char content hash>.<ext>, so a
    # changed file gets a new URL and the old one can be cached for good. (No "always" on
    # Cache-Control: a 404 for a file that a newer deploy removed must not be cached for a year.)
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Everything else that is static comes from public/ (logos, favicon, OG image, QR code,
    # diagrams) and keeps its URL when it is replaced, so it must not be marked immutable.
    # (add_header inside a location replaces the inherited ones, hence nosniff again.)
    location ~* \.(png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # EN legal pages and the AI chat page are not translated (chat's
    # knowledge base is Chinese-only) — 302 back to the ZH version.
    # Real 302 so crawlers get Location on the first hop, no JS dependency.
    # Must be authoritative (RULE 8 doesn't apply: this is a build asset in
    # the portal repo, not a K8s manifest) — the client-side ZhOnlyGuard
    # fallback only covers vite dev/preview or if this rule is ever removed.
    location ~ ^/en/(privacy|legal|cookies|legal-center|chat)/?$ {
        return 302 /$1;
    }

    # /api/ is routed by K8s Ingress to web-api service — no proxy_pass here.
    # Pages the app renders only in the browser (no prerendered copy) get the bare app
    # shell, which boots the app and renders the route. Keep this list in step with
    # src/app/routes.tsx: src/__tests__/route-coverage.test.ts fails when a route is
    # neither prerendered (scripts/public-routes.mjs) nor listed here.
    # client-only-routes
    location ~ ^(/en)?/(login|register|account|account/submissions|chat|workflow|platform|features|quick-start|docs|token-service|resources/(documents|software))/?$ {
        try_files /app-shell.html =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Everything else is a file: index.html and the prerendered per-route copies
    # (scripts/prerender.mjs). A URL that is neither a file nor a client-only route above is
    # a real 404 with the prerendered 404 page. It used to fall back to index.html, which is
    # the home page's snapshot, so every unknown URL answered 200 with the home page's
    # content. Hashed JS/CSS are handled by the regex block above. HTML must not be cached,
    # or a deploy's new asset hashes aren't picked up and the page 404s its own scripts.
    # (add_header here replaces the inherited security headers, so they're repeated.)
    location / {
        try_files $uri $uri/ =404;
        error_page 404 $not_found_page;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
