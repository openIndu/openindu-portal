server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 5g;

    # Emit relative Location headers (no scheme/host/port) on redirects below,
    # so a TLS-terminating ingress in front of this container (listening on
    # plain :80 itself) doesn't get its https:// downgraded to http:// in the
    # rebuilt absolute URL, forcing an extra plaintext hop.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static assets. Vite names its build output <name>-<8-char content hash>.<ext>, so a
    # changed file gets a new URL and the old one can be cached for good. (No "always" on
    # Cache-Control: a 404 for a file that a newer deploy removed must not be cached for a year.)
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Everything else that is static comes from public/ (logos, favicon, OG image, QR code,
    # diagrams) and keeps its URL when it is replaced, so it must not be marked immutable.
    # (add_header inside a location replaces the inherited ones, hence nosniff again.)
    location ~* \.(png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://web-api:8004/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # EN legal pages and the AI chat page are not translated (chat's
    # knowledge base is Chinese-only) — 302 back to the ZH version.
    # Real 302 so crawlers get Location on the first hop, no JS dependency.
    # Must be authoritative (RULE 8 doesn't apply: this is a build asset in
    # the portal repo, not a K8s manifest) — the client-side ZhOnlyGuard
    # fallback only covers vite dev/preview or if this rule is ever removed.
    location ~ ^/en/(privacy|legal|cookies|legal-center|chat)/?$ {
        return 302 /$1;
    }

    # Handle React Router - serve index.html for all routes. This location only
    # ever serves HTML (index.html + the prerendered per-route copies) — hashed
    # JS/CSS are handled by the regex block above. HTML must not be cached, or a
    # deploy's new asset hashes aren't picked up and the page 404s its own
    # scripts. (add_header here replaces the inherited security headers, so
    # they're repeated.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}